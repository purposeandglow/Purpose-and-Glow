        "email": "purposeandglowcareers@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "MN",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "Country",
          "name": "United States"
        },
        "priceRange": "$0 - $239",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Career Solutions & Résumé Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",

              },
              "price": "0",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Professional Résumé Revamp",
                "description": "Complete modernization of an existing résumé with ATS alignment and 24-48 hour turnaround."
              },
              "price": "99",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Résumé Created From Scratch",
                "description": "Ground-up résumé creation for 8-15+ year tenured professionals and career pivoters."
              },
              "price": "145",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Student Résumé Services",

            }
          ]
        }
      }
    </script>
    <script>
      // Suppress development WebSocket/HMR disconnect errors in AI Studio iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          ((typeof event.reason.message === 'string' &&
            (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite:ws'))) ||
            (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
    </script>

  </body>
